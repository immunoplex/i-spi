services:
  i-spi:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_STAMP: "${BUILD_STAMP:-dev}"
    env_file: .env
    environment:
      - SHINY_LOG_LEVEL=TRACE
    ports:
      - "3838:3838"
    stdin_open: true
    tty: true
    image: i-spi
    container_name: i-spi
