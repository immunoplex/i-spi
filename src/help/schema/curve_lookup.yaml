# Source: live DB introspection, dev/data_tab_schema_report.sql ->
# dev/data_tab_schema_report_output.txt (2026-10-09). No DDL file exists for
# this table in either repo checkout -- this is the authoritative source.
#
# referenced_by is scoped to the 16 Data-tab tables this help system
# documents. The live report also shows curve_lookup.curve_id referenced by
# several legacy/internal tables outside that scope (bayes_curves,
