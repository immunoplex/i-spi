---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  creationTimestamp: null
  name: madi-lumi-reader
spec:
  encryptedData:
    AUTH0_KEY: 
    AUTH0_SECRET: 
    db_pwd_x: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      creationTimestamp: null
      name: madi-lumi-reader
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: i-spi
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: I-SPI-stripprefix@file
spec:
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: "/I-SPI"
        backend:
          service:
            name: i-spi
            port:
              number: 3838
---
apiVersion: v1
kind: Service
metadata:
  name: i-spi
  labels:
    app: i-spi
spec:
  type: ClusterIP
  ports:
  - port: 3838
  selector:
    app: i-spi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i-spi
  labels:
    app: i-spi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: i-spi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: i-spi
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
      - name: regcred
      containers:
        - image: ghcr.io/immunoplex/i-spi:main
          imagePullPolicy: Always
          name: i-spi
          # readinessProbe:
          #   exec:
          #     command:
          #     - sh
          #     - -c
          #     - 'curl -s http://localhost/ | grep "Welcome to nginx"'
          #   initialDelaySeconds: 5
          #   periodSeconds: 30
          #command: ["R", "-e", "auth0::shinyAppAuth0('/usr/bin/shiny-server', host = '0.0.0.0', port = 3838)"]
          #workingDir: /srv/shiny-server
          env:
            - name: db
              value: "postgres"
            - name: db_host
              value: "mlr-c3d7-db.c.dartmouth.edu"
            - name: db_port
              value: "5432"
            - name: db_userid_x
              value: "d78039e"
            - name: db_pwd_x
              valueFrom:
                secretKeyRef:
                  name: madi-lumi-reader
                  key: db_pwd_x
            - name: AUTH0_USER
              value: "dev-dwgc2s48mde2re45.us"
            - name: AUTH0_KEY
              valueFrom:
                secretKeyRef:
                  name: madi-lumi-reader
                  key: AUTH0_KEY
            - name: AUTH0_SECRET
              valueFrom:
                secretKeyRef:
                  name: madi-lumi-reader
                  key: AUTH0_SECRET
            - name: AUTH0_REMOTE_URL
              value: "https://i-spi-preprod.dartmouth.edu/"
            # i-spi-compute (api+redis+worker) job API. Replaces the retired
            # BATCH_API_URL/BATCH_API_KEY batch-calculator client. The app's
            # compute_api_client.R reads these two vars and POSTs to <URL>/jobs
            # with header X-API-Key: <ISPI_COMPUTE_API_KEY>.
            #   - ISPI_COMPUTE_URL is the base URL INCLUDING the /i-spi-compute
            #     root path and NO trailing /jobs; Traefik strips /i-spi-compute
            #     so the API (ROOT_PATH=/i-spi-compute) sees /jobs.
            #   - ISPI_COMPUTE_API_KEY comes from the i-spi-compute SealedSecret
            #     key API_KEY -- the SAME value the API enforces, so client and
            #     server can never drift.
            - name: ISPI_COMPUTE_URL
              value: "https://madi-preprod.dartmouth.edu/i-spi-compute"
            - name: ISPI_COMPUTE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: i-spi-compute
                  key: API_KEY
            # - name: ISPI_COMPUTE_VERBOSE   # set "TRUE" to log each request/response
            #   value: "FALSE"
            - name: SHINY_LOG_LEVEL
              value: DEBUG
            - name: SHINY_LOG_STDERR
              value: "1"
            - name: REDIRECT_URL
              value: "https://madiproject_11.org"
            - name: PGSSLCERT
              value: "/tmp/postgresql.crt"
            - name: DEX_ISSUER
              value: "https://madi-preprod.dartmouth.edu/dex"
            - name: DEX_CLIENT_ID
              value: "5MGz5KrECFxiHMdnUeHYDhCRK63Nun74"
            - name: DEX_CLIENT_SECRET
              value: "wrbSLdm2OiTnCL5IKS92GizhBx2ic9HC"
            - name: APP_REDIRECT_URI
              value: https://i-spi-preprod.dartmouth.edu/
          ports:
          - containerPort: 3838
            name: shiny
